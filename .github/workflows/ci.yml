name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:build
      - run: npm run plugin:build
      - run: npm ci --prefix compat/mcp-sdk --ignore-scripts --no-audit --no-fund
      - run: npm run test:mcp
      - run: npm ci --prefix compat/typescript --ignore-scripts --no-audit --no-fund
      - run: npm run test:types
      - run: npm run example:sdk
      - run: npm run check:agent
      - run: node bin/plumbcheck.js run examples/customer-support/safe.json --out reports/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: reports/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Runtime dependencies shipped in the npm package and the Windows app
        run: npm audit --omit=dev --audit-level=high
      # Electron is a devDependency here but ships inside the Windows app, so audit everything.
      - name: Electron runtime and desktop build tooling
        run: npm audit --prefix desktop --audit-level=high
