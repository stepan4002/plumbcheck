name: Android
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', 'scripts/build-mobile.mjs', 'src/**', 'package*.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'mobile/**', 'scripts/build-mobile.mjs', 'src/**', 'package*.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run mobile:build
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PlumbCheck-Android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
